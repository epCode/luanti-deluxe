# Main menu for Mineclonia (see doc/menu_customization.md in the engine)

# Start Game tab: the world list
start_tab = worlds
# Join Game tab: Minecraft-like server list of Mineclonia servers
join_tab = servers

# No splash text
splash = false

# The logo says it already
topleft_text =

# World list: what to show next to each world's name ($option = world option)
world_summary = $mcl_game_mode, $mcl_difficulty

# Minecraft-style buttons (button.png, button_hovered.png, button_pressed.png)
button_middle = 6
button_text_color = #e0e0e0

# Rotating panorama from panorama_0..5.jpg (front, right, back, left, up, down)
panorama_speed = 1.5
